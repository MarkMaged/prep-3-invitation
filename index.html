<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>قلباً جديداً — دعوة</title>
<meta name="description" content="دعوة رقمية أنيقة — قلباً جديداً — اليوم 11.9.2026 الساعة 6:00 مساءً في قاعة مارمرقس">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Cairo:wght@600;700;800;900&family=Montserrat:wght@700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="stage">

  <main class="invitation" aria-labelledby="mainTitle">
    <div class="paper-overlay" aria-hidden="true"></div>
    <div class="light-sweep" aria-hidden="true"></div>

    <!-- Header row: 2026 + tassel (left)   /   church logo (right) -->
    <div class="head-row">
      <div class="side-decor" aria-hidden="true">
        <div class="cord-wrap">
          <svg class="cord" viewBox="0 0 6 40" width="4" height="70" preserveAspectRatio="none">
            <line x1="3" y1="0" x2="3" y2="40" stroke="#181614" stroke-width="3"/>
          </svg>
          <svg class="tassel" viewBox="0 0 46 120" width="40" height="104" fill="none">
            <circle cx="23" cy="10" r="8" fill="#181614"/>
            <rect x="10" y="15" width="26" height="6" rx="1" fill="#b6863f"/>
            <path d="M23 21 v10" stroke="#181614" stroke-width="3"/>
            <line x1="7" y1="31" x2="42" y2="31" stroke="#181614" stroke-width="3"/>
            <g stroke="#181614" stroke-width="3.2" stroke-linecap="round">
              <line x1="9"  y1="31" x2="6"  y2="112"/>
              <line x1="14" y1="31" x2="12" y2="118"/>
              <line x1="19" y1="31" x2="18" y2="121"/>
              <line x1="23" y1="31" x2="23" y2="122"/>
              <line x1="27" y1="31" x2="28" y2="121"/>
              <line x1="32" y1="31" x2="34" y2="118"/>
              <line x1="37" y1="31" x2="40" y2="112"/>
            </g>
          </svg>
        </div>
        <div class="year-stack">
          <span>2</span><span>0</span><span>2</span><span>6</span>
        </div>
      </div>

      <div class="logo-wrap">
       <img class="logo" src="assets/logo.png" alt="شعار الكنيسة" width="60" height="60">
      </div>
    </div>

    <p class="wordmark">OY&#828;HT MBEPI</p>

    <section class="verse" aria-label="آية من الكتاب المقدس">
      <p class="verse-text">
        <span class="v-line">«فَوْقَ كُلِّ تَحَفُّظٍ احْفَظْ قَلْبَكَ،</span>
        <span class="v-line">لِأَنَّ مِنْهُ مَخَارِجَ الْحَيَاةِ.»</span>
      </p>
      <p class="verse-ref">(أمثال 4 : 23)</p>
    </section>

    <header class="header">
      <h1 class="title" id="mainTitle">اوهيت إم فيري</h1>
      <p class="subtitle">«قلباً جديداً»</p>
    </header>

    <section class="info" aria-label="تفاصيل الدعوة">
      <div class="info-row" style="--i:0">
        <span class="info-text">اليوم: 11.9.2026</span>
        <span class="icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="5" width="18" height="16" rx="2"/>
            <line x1="16" y1="3" x2="16" y2="7"/>
            <line x1="8" y1="3" x2="8" y2="7"/>
            <line x1="3" y1="10" x2="21" y2="10"/>
          </svg>
        </span>
      </div>
      <div class="info-row" style="--i:1">
        <span class="info-text">الوقت: 6:00 PM</span>
        <span class="icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="9"/>
            <polyline points="12 7 12 12 16 14"/>
          </svg>
        </span>
      </div>
      <div class="info-row" style="--i:2">
        <span class="info-text">المكان: قاعة مارمرقس</span>
        <span class="icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/>
            <circle cx="12" cy="9.5" r="2.4"/>
          </svg>
        </span>
      </div>
    </section>

    <p class="students-only">FOR STUDENTS ONLY</p>

    <footer class="footer" aria-hidden="true">
      <svg class="grad-cap grad-cap--left" viewBox="0 0 64 44" width="40" height="28">
        <path d="M32 2 2 15l30 13 30-13z" fill="#181614"/>
        <path d="M32 28 12 19v9c0 4 9 9 20 9s20-5 20-9v-9z" fill="#221f1c"/>
        <line x1="58" y1="15" x2="58" y2="30" stroke="#b6863f" stroke-width="2"/>
        <circle cx="58" cy="32" r="2.2" fill="#b6863f"/>
      </svg>
      <svg class="grad-cap grad-cap--right" viewBox="0 0 64 44" width="58" height="40">
        <path d="M32 2 2 15l30 13 30-13z" fill="#181614"/>
        <path d="M32 28 12 19v9c0 4 9 9 20 9s20-5 20-9v-9z" fill="#221f1c"/>
        <line x1="6" y1="15" x2="6" y2="30" stroke="#b6863f" stroke-width="2"/>
        <circle cx="6" cy="32" r="2.2" fill="#b6863f"/>
      </svg>
    </footer>

  </main>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
</div>

<script src="script.js"></script>
</body>
</html>
